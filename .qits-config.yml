# qits' own in-repo configuration — the single source of truth for its managed services, bootstrap
# chain and actions (docs/epics/qits-workspace-daemon/features/2026-07-24_config-as-single-source-of-truth.md).
# qits conforms to its own managed-app convention: on a qits deployment (qits-in-qits) each workspace's
# daemon reads this file in-container from its own branch's checkout — nothing is ingested host-side.
# Editing qits' managed config is a commit like any other.
version: 1

repository:
  main-branch: main
  archetype: SERVICE

# Explicit stack hints (detection also finds these by markers): the Quarkus reactor at the root and
# the Angular SPA under the service module's Quinoa UI dir.
frameworks:
  - kind: java-quarkus
    root: .
  - kind: ts-angular
    root: service/src/main/webui

services:
  # The qits server: the PACKAGED app (prod fast-jar) serving the REST API on :8080 and the prebuilt
  # Angular SPA (Quinoa serves it statically — NO `ng serve`), web-viewable through the parent qits'
  # proxy. Deliberately NOT `quarkus:dev`: a workspace exists to build/test the app, so live-reload
  # is wasted resources (~1.1 GiB of `ng serve`/esbuild + a heavier dev JVM — see
  # docs/issues/2026-07-25_wedged-workspace-service-not-recovered.md). The bootstrap `install` step
  # builds this jar (with the `local` auth variant) before the service starts. The web view frames
  # QUARKUS (:8080, entry /projects). See docs/guides/qits-in-qits-registration.md.
  - name: qits server
    description: >-
      Runs the packaged qits fast-jar (`service/target/quarkus-app/quarkus-run.jar`) — the REST API
      and the prebuilt Angular SPA — web-viewable through the parent qits proxy. Rebuild + restart to
      pick up code changes (no live-reload, by design).
    # `-D` flags precede `-jar` (JVM system properties, not program args). The `local` auth variant
    # (built into the jar by bootstrap `install`) authenticates every request as a fixed local user,
    # so the framed child is usable with no proxy and no login — a packaged NORMAL-mode build has no
    # dev fallback (docs/epics/qits-authentication/). root-path serves under the web-view prefix; the
    # OTEL flags light qits' own telemetry; the speech warmup is skipped so a demo child doesn't pull
    # the ~700 MB model.
    start: >-
      java
      -Dquarkus.http.host=0.0.0.0
      -Dquarkus.http.port=8080
      -Dquarkus.http.root-path="${QITS_PUBLIC_BASE:-/}"
      -Dquarkus.otel.sdk.disabled=false
      -Dquarkus.otel.exporter.otlp.endpoint="${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}"
      -Dqits.speech.warmup-on-start=false
      -jar service/target/quarkus-app/quarkus-run.jar
    # Prod Quarkus prints this once the HTTP server is up; the SPA is baked into the jar, so READY
    # implies the whole app (API + SPA) is servable.
    ready-pattern: "(?i)Listening on: http"
    stop-signal: TERM
    restart-policy: ON_FAILURE
    auto-start: true
    max-restarts: 3
    otel: true
    web-view:
      port: 8080
      entry-path: projects
    health-checks:
      # COMMAND, not HTTP: /q/health sits under the env-expanded root path.
      - name: Quarkus
        kind: COMMAND
        command: |-
          curl -fsS -m 2 "http://127.0.0.1:8080${QITS_PUBLIC_BASE%/}/q/health"
      # No Angular health-check: the packaged run serves the prebuilt SPA from :8080 (Quinoa static),
      # there is no `ng serve` on :4200.

# The bootstrap chain (docs/epics/qits-workspaces/features/2026-07-18_workspace-bootstrap-commands.md): ordered one-shot
# steps a freshly provisioned child-qits workspace runs before the dev-server daemon auto-starts.
# The order is load-bearing — the repo's own build guard fails any lifecycle build once something
# listens on :8080, so `install` can never run after the daemon is up. Both cli seeds are
# idempotent by design (skip-if-exists / reset), so re-provisions and manual re-runs are safe.
bootstrap:
  - name: install
    description: >-
      Build the reactor incl. the packaged service jar the `qits server` service runs (skip tests;
      `local` auth variant — the unauthenticated build for this trusted local child).
    execute: ./mvnw install -DskipTests -Dqits.variant=local
  - name: seed-demo-data
    description: Seed the tiny testing-repo demo (idempotent, skip-if-exists).
    execute: ./mvnw -pl cli quarkus:run -Dcli.args=seed
    # Skip once the shared H2 file exists — the seed itself also skips, this just saves the JVM.
    check: test ! -f ~/.qits/data/h2/qits.mv.db
  - name: seed-webapp-demo
    description: Seed the servable Quarkus+Angular demo (idempotent by reset).
    execute: ./mvnw -pl cli quarkus:run -Dcli.args=seed-webapp

# Dogfood build/test/lint actions — the everyday qits workflow (CLAUDE.md). Every service-touching
# build names the forwardauth variant; module-scoped domain/cli builds don't need it.
actions:
  - name: build
    description: Full reactor build (frontend + backend), forwardauth variant.
    execute: ./mvnw package -Dqits.variant=forwardauth
  - name: test-domain
    description: Domain service / business-logic tests.
    execute: ./mvnw -pl domain test
  - name: test-service
    description: REST / mutiny / health / validation / openapi tests (forwardauth only).
    execute: ./mvnw -pl service -am test -Dqits.variant=forwardauth
  - name: test-cli
    description: The seed command tests.
    execute: ./mvnw -pl cli test
  - name: format-check
    description: Verify google-java-format (Spotless) formatting without rewriting.
    execute: ./mvnw spotless:check -Dqits.variant=forwardauth
  - name: lint-frontend
    description: ESLint the Angular sources (TS + template a11y rules).
    execute: pnpm --dir service/src/main/webui lint
