# Domain tests run against in-memory H2, so the suite needs no Docker/Testcontainers.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:qits;DB_CLOSE_DELAY=-1
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true

# One stable repositories dir shared by the whole suite, so repository tests share a single Quarkus
# app instead of each spinning up its own (a per-class @TestProfile with a unique
# Files.createTempDirectory() path used to force a full app restart per class — dozens of restarts
# accumulating classloader/metaspace in the reused fork until it OOM'd). Per-class isolation is
# restored by RepoDataDirReset, which wipes this dir before every test class.
qits.repositories.data-dir=target/qits-test-repos

# Keep the git credential store under target/ (never the module dir the relative default points at).
qits.repositories.credentials-file=target/test-data/git-credentials

# Service↔container lifecycle coupling is off during tests — existing tests drive the supervisor
# explicitly and expect precise control. The coupler tests re-enable each direction via a
# @TestProfile.
qits.services.autostart-enabled=false
qits.services.autostop-enabled=false

# The transcript-tail tests drive polls synchronously (pollNow); park the schedule out of the way.
qits.agent.transcript-tail-poll-ms=3600000
