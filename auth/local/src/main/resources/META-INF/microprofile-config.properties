# Defaults for the `local` build variant (docs/epics/qits-authentication/features/2026-07-16_build-variant-auth.md).
# Shipped as microprofile-config.properties because Quarkus reads THIS file from dependency jars
# (ordinal 100, below the app's application.properties at 250 and env at 300).
#
# SECURITY: this variant is EXPLICITLY UNAUTHENTICATED — every request is the fixed local user, in
# any launch mode. It exists only for trusted LOCAL starts (a workspace's own packaged qits behind
# the parent on qits-net; a laptop run). Never internet-expose a local-variant qits. The auth-scheme
# variants (forwardauth/oidc) never allow this; only -Dqits.variant=local produces an open build.

# The variant contract (see eu.wohlben.qits.security's package-info): reported by /api/auth/me and
# expanded into a build-time property in service, so a variant-less build fails augmentation.
qits.auth.variant=local

# The fixed identity every request is authenticated as.
qits.auth.local.user=local

# Optional comma-separated roles for the local identity, so qits.auth.required-role can be exercised
# locally. Empty ⇒ roleless (an empty value reads as absent for the Optional config property).
qits.auth.local.groups=
