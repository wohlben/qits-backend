# CLI tests run against in-memory H2, so the suite needs no Docker/Testcontainers.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:qits;DB_CLOSE_DELAY=-1
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true

# Keep the git credential store under target/ (never the real ~/.qits the main config points at).
qits.repositories.credentials-file=target/test-data/git-credentials
